name: Window 10

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    # -------------------------------------------------
    # 1️⃣  Get the latest ngrok Windows zip from GitHub
    # -------------------------------------------------
    - name: Get latest ngrok URL
      id: ngrok_url
      run: |
        # Ask GitHub for the latest release metadata
        $release = Invoke-RestMethod `
          -Headers @{ Accept = 'application/vnd.github.v3+json' } `
          https://api.github.com/repos/ngrok/ngrok/releases/latest

        # Find the Windows‑amd64 asset
        $asset = $release.assets |
                 Where-Object { $_.name -like '*windows-amd64.zip' } |
                 Select-Object -First 1

        if (-not $asset) {
          Write-Error "Could not locate the Windows zip asset in the latest release."
          exit 1
        }

        # Export the download URL for the next step
        Write-Output "NGROK_URL=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT
    # -------------------------------------------------
    # 2️⃣  Download the zip we just discovered
    # -------------------------------------------------
    - name: Download ngrok
      run: |
        Invoke-WebRequest $env:NGROK_URL -OutFile ngrok.zip
      env:
        NGROK_URL: ${{ steps.ngrok_url.outputs.NGROK_URL }}

    - name: Extract
      run: Expand-Archive ngrok.zip

    - name: Auth
      run: .\ngrok\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable TS
      run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0

    - run: Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - run: Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "@cyb3rking" -Force)

    - name: Create Tunnel
      run: .\ngrok\ngrok.exe tcp 3389
