name: Windows 10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Hard-coded at your request. Use a disposable password.
          $password = ConvertTo-SecureString `
            -AsPlainText 'Cedar!Orbit7#Lantern' `
            -Force

          Set-LocalUser -Name 'runneradmin' -Password $password

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

      - name: Show Tailscale IP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ip = tailscale ip -4

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw 'Could not get the runner Tailscale IP.'
          }

          Write-Host "Connect Windows App to: $($ip.Trim())"

      - name: Keep runner online
        shell: pwsh
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
