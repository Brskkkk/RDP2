name: Windows 10

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download latest stable ngrok
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://bin.ngrok.com/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" `
            -OutFile ngrok.zip

          Expand-Archive -Path ngrok.zip -DestinationPath ngrok -Force

          if (-not (Test-Path ".\ngrok\ngrok.exe")) {
            throw "ngrok.exe was not found after extracting the download."
          }

      - name: Configure ngrok
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
            throw "Add NGROK_AUTH_TOKEN in the repository Actions secrets."
          }

          .\ngrok\ngrok.exe config add-authtoken $env:NGROK_AUTH_TOKEN

      - name: Enable Remote Desktop
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Add RDP_PASSWORD in the repository Actions secrets."
          }

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1

          Set-LocalUser -Name 'runneradmin' -Password (
            ConvertTo-SecureString -AsPlainText $env:RDP_PASSWORD -Force
          )

      - name: Start ngrok TCP tunnel
        shell: pwsh
        run: .\ngrok\ngrok.exe tcp 3389
